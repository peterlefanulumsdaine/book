% tex4ht configuration for the EPUB3 build. See EPUB_NOTES.md.
\Preamble{xhtml,mathml}
\begin{document}
% \ensuremath{X}\xspace without leaving \xspace behind in math mode, where it
% would sit between a subscript and a following superscript; see
% epub/script-macros.py.
\makeatletter
\protected\def\hottmath{\ifmmode\expandafter\@firstofone\else\expandafter\hott@textmath\fi}
\newcommand\hott@textmath[1]{$#1$\xspace}
\makeatother
% Re-read macro definitions containing ^ or _ now that tex4ht has made them
% active; see epub/script-macros.py.
\input{hott-epub-macros}
% \tproj always emitted `_{n}^{#1}`, even with #1 empty, so `\cd{A}^{\cd{B}}`
% became a double superscript once the empty \mathclose{} (below) is gone.
% Emit ^{#1} only when non-empty; choose by expansion so tex4ht's lookahead
% after the subscript sees the document's own ^.
\makeatletter
\renewcommand{\tproj}[3][]{\hott@tproj{#1}{#2}{#3}}
\def\hott@tproj#1#2#3{\ifx\relax#1\relax\expandafter\@firstoftwo\else\expandafter\@secondoftwo\fi
  {\left|#3\right|_{#2}}{\left|#3\right|_{#2}^{#1}}}
\makeatother
% EPUB content is XHTML, so <math> needs its namespace (tex4ht's HTML5 mode
% omits it). Without it epubcheck rejects every formula.
\Configure{math-xmlns}{xmlns="http://www.w3.org/1998/Math/MathML"}
% tex4ht's MathML image config (html-mml.4ht) pauses math classification
% while writing an image's alt text, but its "resume" special ends up inside
% the alt attribute and never takes effect. Every formula after the first
% image (the title-page torus, then each xymatrix/tikz SVG) came out as flat
% text with no <mi>/<mo>. Same config, minus the pause.
% Also: tex4ht wraps images inside math (the diagrams) in
% <semantics><annotation-xml>, and MathML Core renders only the first child
% of <semantics>, so every diagram was invisible. <mtext> is an HTML
% integration point in browsers, so the <img> renders there.
\catcode`\:=11
\Configure{IMG}
  {\ht:special{t4ht=\ifmathml <mtext>\fi<img \ifmathml xmlns="http://www.w3.org/1999/xhtml"\fi\space src="}}
  {\ht:special{t4ht=" alt="}}
  {" }
  {\ht:special{t4ht=" }}
  {\ht:special{t4ht= />\ifmathml </mtext>\fi}}
\catcode`\:=12
% Vertical box offsets mean nothing in reflowable HTML, and the book's
% \raisebox{\depth-\height+1em} (hlevels.tex) breaks tex4ht's parser.
% \hbox (not a macro argument) so xy-pic can still re-catcode its contents.
\renewcommand\raisebox[1]{\hbox}
% Path concatenation: a plain raised-dot operator in MathML.
\renewcommand{\ct}{\mathbin{\cdot}}
% tex4ht writes the MathML of section titles as raw UTF-8 into the
% .4ct/.4tc TOC files, which pdfLaTeX's inputenc then refuses to read
% back. Pass undefined UTF-8 characters through untouched.
\makeatletter
\def\UTFviii@undefined@err#1{\HCode{#1}}
\makeatother
% tex4ht already lists \section* in the TOC; the explicit \addcontentsline
% in these macros duplicated each entry and broke the NCX nesting.
\renewcommand{\sectionNotes}{\section*{Notes}}
\renewcommand{\sectionExercises}[1]{\section*{Exercises}}
% main.tex adds Bibliography and Index to the TOC as fake `part` entries.
% tex4ht already lists their starred headings, and the fake parts break the
% NCX nesting, so drop part-level \addcontentsline.
\let\hottAddContentsLine\addcontentsline
\renewcommand{\addcontentsline}[3]{\ifstrequal{#2}{part}{}{\hottAddContentsLine{#1}{#2}{#3}}}
% Index locators: the current section number (as in the 2013 discussion on
% HoTT/book#287) instead of meaningless page numbers. Unlike tex4ht's
% sec-index option, this keeps unique per-entry anchors.
\makeatletter
\newcommand{\hottIndexLocator}{%
  \ifnum\c@section=0 \thechapter
  \else\ifnum\c@subsection=0 \thesection
  \else\thesubsection\fi\fi}
\makeatother
\Configure{makeindex}{\hottIndexLocator}
% The macros use `\mathopen{}...\mathclose{}` as a spacing hint (\trunc,
% \pairr, \trans, \map, ...). tex4ht turns an empty \mathclose{} into an empty
% <mo> that sometimes swallows the next element, producing ill-formed
% MathML. Spacing hints mean nothing in MathML: drop the empty ones.
\makeatletter
\let\hott@mathopen\mathopen
\let\hott@mathclose\mathclose
\def\hott@dropempty#1#2{\if\relax\detokenize{#2}\relax\else#1{#2}\fi}
\def\mathopen{\@ifnextchar\bgroup{\hott@dropempty\hott@mathopen}\hott@mathopen}
\def\mathclose{\@ifnextchar\bgroup{\hott@dropempty\hott@mathclose}\hott@mathclose}
\makeatother
% Sentinel emitted by hott-epub.ist before index page lists; see hott-epub.mk4.
\def\IDXP{}
% Dark mode. tex4ht's CSS already follows the reader's theme for text and
% inverts its (black-on-transparent) diagram images under
% prefers-color-scheme: dark. Apple Books' night themes signal themselves via
% an attribute on the root element instead, so invert there too.
\Css{:root[__ibooks_internal_theme*="Night"] img[src^="hott-epub"],
  :root[__ibooks_internal_theme*="Gray"] img[src^="hott-epub"] { filter: invert(1); }}
% Inverted diagrams sit in a black box; screen blending makes it vanish into
% whatever dark background the theme uses.
\Css{@media (prefers-color-scheme: dark) { img[src^="hott-epub"] { mix-blend-mode: screen; } }}
\Css{:root[__ibooks_internal_theme*="Night"] img[src^="hott-epub"],
  :root[__ibooks_internal_theme*="Gray"] img[src^="hott-epub"] { mix-blend-mode: screen; }}
% The coloured table of homotopy groups of spheres (8.1) has pastel cell
% backgrounds: keep its text dark in every theme.
\Css{div[id^="colorbox"] { color: \#000; }}
\EndPreamble
